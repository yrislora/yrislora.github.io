<!DOCTYPE html>
<html>
<head>
  <title>🐻 Bear Detector 🐼</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(#dff3ff, #f5fbff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 50px 0;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      text-align: center;
      width: 380px;
    }

    h1 {
      color: #444;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    button {
      background: #8fd3ff;
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 15px;
    }

    button:hover {
      background: #5ec3ff;
      transform: scale(1.05);
    }

    #webcam-container canvas {
      border-radius: 20px;
      border: 4px solid #e6f6ff;
      margin-top: 15px;
    }

    #label-container div {
      background: #f2f9ff;
      margin: 6px 0;
      padding: 8px;
      border-radius: 15px;
      color: #555;
      font-weight: bold;
    }

    #gallery {
      margin-top: 25px;
    }

    .snapshot {
      background: #f8fcff;
      padding: 12px;
      border-radius: 18px;
      margin-top: 15px;
      border: 2px solid #eaf7ff;
    }

    .snapshot img {
      width: 100%;
      border-radius: 15px;
    }

    .snapshot p {
      font-size: 14px;
      margin-top: 8px;
      color: #444;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🐻 We Bare Bears Detector 🐼🐻‍❄️</h1>
    <div class="subtitle">Ice Bear. Panda. Grizz. Who are you today? ☁️</div>

    <button id="mainButton" onclick="handleMainButton()">Start Adventure 🧭</button>

    <div id="webcam-container"></div>
    <div id="label-container"></div>
    <div id="gallery"></div>
  </div>

<script>
  const URL = "./model/";

  let model, webcam, labelContainer, maxPredictions;
  let started = false;

  function handleMainButton() {
    if (!started) {
      init();
    } else {
      capture();
    }
  }

  async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(250, 250, true);
    await webcam.setup();
    await webcam.play();
    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container").appendChild(webcam.canvas);
    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";

    for (let i = 0; i < maxPredictions; i++) {
      labelContainer.appendChild(document.createElement("div"));
    }

    started = true;
    const btn = document.getElementById("mainButton");
    btn.innerText = "📸 Capture Bear Moment";
    btn.style.background = "#5ec3ff";
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);

    for (let i = 0; i < maxPredictions; i++) {
      const percent = (prediction[i].probability * 100).toFixed(1);
      labelContainer.childNodes[i].innerHTML =
        "🐾 " + prediction[i].className + ": " + percent + "%";
    }
  }

  async function capture() {
    if (!model || !webcam) return;

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = webcam.canvas.width;
    tempCanvas.height = webcam.canvas.height;
    tempCanvas.getContext("2d").drawImage(webcam.canvas, 0, 0);

    const prediction = await model.predict(tempCanvas);

    let resultText = "";
    for (let i = 0; i < prediction.length; i++) {
      const percent = (prediction[i].probability * 100).toFixed(1);
      resultText += `${prediction[i].className}: ${percent}%<br>`;
    }

    const div = document.createElement("div");
    div.className = "snapshot";
    div.innerHTML = `
      <img src="${tempCanvas.toDataURL()}">
      <p>🐻 Results:<br>${resultText}</p>
    `;

    document.getElementById("gallery").prepend(div);
  }
</script>

</body>
</html>
