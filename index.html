<!DOCTYPE html>
<html>
<head>
  <title>🎀 AI Camera 🎀</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #ffcce6, #ffe6f2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
    }

    .card {
      background: #fff0f7;
      padding: 30px;
      border-radius: 30px;
      box-shadow: 0 10px 40px rgba(255,105,180,0.2);
      text-align: center;
      width: 360px;
      border: 4px solid #ffb3d9;
      <button id="mainButton" onclick="handleMainButton()">Start 💖</button>
    }

    h1 {
      color: #ff4da6;
      margin-bottom: 5px;
    }

    p {
      color: #cc0066;
      font-size: 14px;
      margin-bottom: 20px;
    }

    
    #webcam-container canvas {
      border-radius: 25px;
      border: 5px solid #ff99cc;
      margin-top: 20px;
    }

    #label-container {
      margin-top: 15px;
    }

    #label-container div {
      background: #ffe6f2;
      margin: 6px 0;
      padding: 8px;
      border-radius: 20px;
      color: #ff3399;
      font-weight: bold;
    }

    #gallery {
      margin-top: 20px;
    }

    .snapshot {
      background: #ffe6f2;
      padding: 10px;
      border-radius: 20px;
      margin-top: 15px;
    }

    .snapshot img {
      width: 100%;
      border-radius: 15px;
      border: 3px solid #ff99cc;
    }

    .snapshot p {
      font-size: 14px;
      color: #cc0066;
      margin: 5px 0 0 0;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎀 Bear Detector 🎀</h1>
    <p>Start camera and capture your bear magic 🐻✨</p>

    <button onclick="init()">Start 💖</button>
    <button onclick="capture()">📸 Take Photo</button>

    <div id="webcam-container"></div>
    <div id="label-container"></div>
    <div id="gallery"></div>
  </div>

<script>
  const URL = "./model/";

  let model, webcam, labelContainer, maxPredictions;

  let started = false;

function handleMainButton() {
  if (!started) {
    init();
  } else {
    capture();
  }
}
  async function init() {
    try {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      const flip = true;
      webcam = new tmImage.Webcam(250, 250, flip);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      document.getElementById("webcam-container").appendChild(webcam.canvas);
      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";

      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
        
      }
      started = true;

const btn = document.getElementById("mainButton");
btn.innerText = "📸 Capture 🎀";
btn.style.background = "#ff3399";

    } catch (error) {
      alert("Model failed to load 💔 Check your /model folder.");
      console.error(error);
    }
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
    
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);

    for (let i = 0; i < maxPredictions; i++) {
      const percent = (prediction[i].probability * 100).toFixed(1);
      labelContainer.childNodes[i].innerHTML =
        "💗 " + prediction[i].className + ": " + percent + "% 🎀";
    }
  }

  async function capture() {
    if (!model || !webcam) return;

    const canvas = webcam.canvas;

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const ctx = tempCanvas.getContext("2d");
    ctx.drawImage(canvas, 0, 0);

    const prediction = await model.predict(tempCanvas);

    let resultText = "";
    for (let i = 0; i < prediction.length; i++) {
      const percent = (prediction[i].probability * 100).toFixed(1);
      resultText += `${prediction[i].className}: ${percent}%<br>`;
    }

    const div = document.createElement("div");
    div.className = "snapshot";
    div.innerHTML = `
      <img src="${tempCanvas.toDataURL()}">
      <p>🐻 Bear Results 🎀<br>${resultText}</p>
    `;

    document.getElementById("gallery").prepend(div);
  }
</script>

</body>
</html>
