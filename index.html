<!DOCTYPE html>
<html>
<head>
  <title>✨ AI Camera ✨</title>

  <!-- Cute font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffd6ec, #d6f6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      color: #ff6fa5;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 50px;
      background: #ff9ed1;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    button:hover {
      background: #ff6fa5;
      transform: scale(1.05);
    }

    #webcam-container canvas {
      border-radius: 20px;
      border: 4px solid #ffb6d9;
      margin-bottom: 15px;
    }

    #label-container div {
      background: #f9f3ff;
      margin: 6px 0;
      padding: 8px;
      border-radius: 15px;
      color: #7b5cff;
      font-weight: 600;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>✨ AI Camera Fairy ✨</h1>
    <p>Let’s see what the model thinks 💕</p>
    <button type="button" onclick="init()">Start Magic ✨</button>
    <div id="webcam-container"></div>
    <div id="label-container"></div>
  </div>

<script type="text/javascript">
    const URL = "./model/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(200, 200, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");

        for (let i = 0; i < maxPredictions; i++) {
            const div = document.createElement("div");
            labelContainer.appendChild(div);
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);

        for (let i = 0; i < maxPredictions; i++) {
            const percent = (prediction[i].probability * 100).toFixed(1);
            labelContainer.childNodes[i].innerHTML =
                "🌸 " + prediction[i].className + ": " + percent + "% ✨";
        }
    }
</script>

</body>
</html>
